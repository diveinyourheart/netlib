name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} ${{ matrix.config }} HTTP2=${{ matrix.http2 }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        config: [Debug, Release]
        http2: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DNETLIB_ENABLE_HTTP2=${{ matrix.http2 }}
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }} --parallel 2
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure --no-tests=error
      - name: Repeat protocol and scheduling tests
        if: runner.os == 'Linux' && matrix.http2 == 'ON'
        run: >-
          ctest --test-dir build/ci -C ${{ matrix.config }}
          -R '^netlib_(http2_session|drain|memory_budget|scheduling)_test$'
          --repeat until-fail:20 --output-on-failure --no-tests=error

  mingw:
    name: MinGW UCRT64 HTTP2=${{ matrix.http2 }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        http2: ["OFF", "ON"]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: >-
          cmake -S . -B build/ci-mingw -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNETLIB_ENABLE_HTTP2=${{ matrix.http2 }}
      - name: Build
        run: cmake --build build/ci-mingw --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-mingw --output-on-failure --no-tests=error
